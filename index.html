<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTO유학CENTER 상담 차트</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0f2a47;--navy2:#1a3f6f;--sky:#38bdf8;--sky-light:#e0f2fe;--sky-dark:#0369a1;--bg:#f0f4f8;--white:#fff;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;--green:#16a34a;--green-bg:#dcfce7;--amber:#d97706;--amber-bg:#fef3c7;--blue:#2563eb;--blue-bg:#dbeafe;--red:#dc2626;--red-bg:#fee2e2;--sidebar-w:220px}
html,body{height:100%}
.login-overlay{position:fixed;inset:0;background:linear-gradient(135deg,#0f2a47,#1a3f6f);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px}
.login-overlay.hidden{display:none}
.login-card{background:white;border-radius:16px;overflow:hidden;width:100%;max-width:360px;box-shadow:0 24px 64px rgba(15,42,71,.4)}
.login-card-header{background:var(--navy);padding:28px 28px 22px;text-align:center}
.login-card-header img{height:76px;width:auto;display:block;margin:0 auto 6px}
.login-card-header p{font-size:10px;color:rgba(255,255,255,.45);letter-spacing:2px;text-transform:uppercase}
.login-card-body{padding:28px}
.login-card-body label{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:8px}
.login-input-wrap{position:relative;margin-bottom:16px}
.login-input-wrap input{font-family:"Noto Sans KR",sans-serif;font-size:15px;color:var(--text);background:var(--bg);border:1.5px solid var(--border);border-radius:9px;padding:12px 44px 12px 14px;outline:none;width:100%;transition:all .15s}
.login-input-wrap input:focus{background:white;border-color:var(--sky);box-shadow:0 0 0 3px rgba(56,189,248,.12)}
.toggle-pw{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;color:var(--muted)}
.login-error{color:#dc2626;font-size:12px;text-align:center;margin-bottom:12px;min-height:18px}
.login-btn{font-family:"Noto Sans KR",sans-serif;font-size:14px;font-weight:700;padding:13px;border-radius:9px;background:var(--navy);color:white;border:none;cursor:pointer;width:100%}
.login-btn:hover{background:var(--navy2)}
body{font-family:"Noto Sans KR",sans-serif;background:var(--bg);display:flex;height:100vh;overflow:hidden;color:var(--text)}
.sidebar{width:var(--sidebar-w);background:var(--navy);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.sidebar-logo{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.07)}
.sidebar-logo img{width:100%;max-width:170px;height:auto;display:block;object-fit:contain}
.sidebar-logo p{font-size:9px;color:rgba(255,255,255,.35);letter-spacing:1.8px;text-transform:uppercase;margin-top:8px}
.sidebar-nav{padding:16px 12px;flex:1}
.nav-label{font-size:9px;color:rgba(255,255,255,.25);letter-spacing:1.5px;text-transform:uppercase;padding:0 8px;margin-bottom:6px;margin-top:16px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:13px;color:rgba(255,255,255,.55);cursor:pointer;transition:all .15s;font-weight:500;margin-bottom:2px;text-decoration:none;border:none;background:none;width:100%;font-family:"Noto Sans KR",sans-serif}
.nav-item:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.85)}
.nav-item.active{background:rgba(56,189,248,.15);color:var(--sky)}
.nav-item .icon{font-size:15px;width:18px;text-align:center}
.sidebar-stats{padding:16px 12px;border-top:1px solid rgba(255,255,255,.07)}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.stat-box{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:10px}
.stat-box .n{font-size:20px;font-weight:700;color:white;line-height:1;font-family:"DM Mono",monospace}
.stat-box .l{font-size:9px;color:rgba(255,255,255,.35);margin-top:3px;text-transform:uppercase}
.stat-box.s-green .n{color:#4ade80}
.stat-box.s-amber .n{color:#fbbf24}
.stat-box.s-sky .n{color:var(--sky)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:white;border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:8px}
.topbar-logo{display:none;height:28px;width:auto}
.topbar-title{font-size:14px;font-weight:700;color:var(--text)}
.topbar-badge{font-size:10px;background:var(--sky-light);color:var(--sky-dark);padding:2px 9px;border-radius:20px;font-weight:600}
.topbar-actions{display:flex;gap:8px}
.btn{font-family:"Noto Sans KR",sans-serif;font-size:12px;font-weight:600;padding:7px 14px;border-radius:7px;cursor:pointer;border:none;display:flex;align-items:center;gap:5px}
.btn-ghost{background:transparent;border:1.5px solid var(--border);color:var(--muted)}
.btn-ghost:hover{border-color:var(--text);color:var(--text)}
.content{flex:1;display:flex;overflow:hidden}
.form-panel{width:380px;flex-shrink:0;background:white;border-right:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column}
.form-panel.hidden{display:none}
.form-panel-header{padding:20px 32px 16px;border-bottom:1px solid var(--border);background:var(--navy);position:sticky;top:0;z-index:2}
.form-panel-header h2{font-size:14px;font-weight:700;color:white}
.form-panel-header p{font-size:11px;color:rgba(255,255,255,.45);margin-top:2px}
.form-body{padding:24px 32px;flex:1}
.form-grid{display:flex;flex-direction:column;gap:14px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.fg{display:flex;flex-direction:column;gap:5px}
label.lbl{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=date],select,textarea{font-family:"Noto Sans KR",sans-serif;font-size:13px;color:var(--text);background:var(--bg);border:1.5px solid var(--border);border-radius:8px;padding:9px 12px;outline:none;width:100%;min-width:0;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{background:white;border-color:var(--sky);box-shadow:0 0 0 3px rgba(56,189,248,.12)}
textarea{resize:vertical;min-height:160px}
.decision-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.dec-btn{font-family:"Noto Sans KR",sans-serif;font-size:12px;font-weight:500;padding:9px 8px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg);color:var(--muted);cursor:pointer;text-align:center}
.dec-btn.sel-yes{background:var(--green-bg);border-color:var(--green);color:var(--green);font-weight:700}
.dec-btn.sel-thinking{background:var(--amber-bg);border-color:var(--amber);color:var(--amber);font-weight:700}
.dec-btn.sel-pending{background:var(--blue-bg);border-color:var(--blue);color:var(--blue);font-weight:700}
.dec-btn.sel-no{background:var(--red-bg);border-color:var(--red);color:var(--red);font-weight:700}
.form-footer{display:flex;gap:8px;padding:14px 32px;border-top:1px solid var(--border);background:white;position:sticky;bottom:0}
.btn-save{flex:1;font-family:"Noto Sans KR",sans-serif;font-size:13px;font-weight:700;padding:11px;border-radius:8px;background:var(--navy);color:white;border:none;cursor:pointer}
.btn-save:hover{background:var(--navy2)}
.btn-reset{font-family:"Noto Sans KR",sans-serif;font-size:12px;padding:11px 16px;border-radius:8px;background:var(--bg);color:var(--muted);border:1.5px solid var(--border);cursor:pointer}
.records-panel{flex:1;display:flex;flex-direction:column;overflow:hidden}
.records-panel.hidden{display:none}
.records-toolbar{padding:14px 20px;background:white;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center;flex-shrink:0}
.search-wrap{flex:1;position:relative}
.search-wrap input{width:100%;padding:8px 12px 8px 34px;font-size:13px;border:1.5px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-family:"Noto Sans KR",sans-serif;outline:none}
.search-wrap input:focus{background:white;border-color:var(--sky)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.filter-select{font-family:"Noto Sans KR",sans-serif;font-size:12px;font-weight:600;padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);outline:none;cursor:pointer}
.records-count{font-size:11px;font-weight:700;background:var(--navy);color:white;padding:4px 12px;border-radius:20px;font-family:"DM Mono",monospace;white-space:nowrap}
.records-list{flex:1;overflow-y:auto;padding:16px 20px}
.record-item{background:white;border:1.5px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .15s}
.record-item:hover{border-color:var(--sky);box-shadow:0 2px 12px rgba(56,189,248,.1);transform:translateY(-1px)}
.record-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0;color:white}
.record-body{flex:1;min-width:0}
.record-name{font-size:14px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.record-phone{font-size:12px;color:var(--muted);font-weight:400;font-family:"DM Mono",monospace}
.record-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.rtag{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500}
.rtag-date{background:#fef9c3;color:#854d0e}
.rtag-ch{background:#e0f2fe;color:#0369a1}
.rtag-co{background:#f3f0ff;color:#5b21b6}
.record-note{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.record-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.record-num{font-size:10px;color:var(--muted);font-family:"DM Mono",monospace}
.dec-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:7px;white-space:nowrap}
.db-yes{background:var(--green-bg);color:var(--green)}
.db-thinking{background:var(--amber-bg);color:var(--amber)}
.db-pending{background:var(--blue-bg);color:var(--blue)}
.db-no{background:var(--red-bg);color:var(--red)}
.db-{background:#f1f5f9;color:var(--muted)}
.inquiry-item{background:white;border:1.5px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:all .15s}
.inquiry-item:hover{border-color:var(--sky);box-shadow:0 2px 12px rgba(56,189,248,.1);transform:translateY(-1px)}
.inquiry-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.inquiry-name{font-size:14px;font-weight:700;color:var(--text)}
.inquiry-date{font-size:11px;color:var(--muted);font-family:"DM Mono",monospace}
.inquiry-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.inquiry-note{font-size:12px;color:var(--muted);line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state .ei{font-size:40px;margin-bottom:12px}
.modal-overlay{position:fixed;inset:0;background:rgba(15,31,61,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(4px)}
.modal-overlay.open{display:flex}
.modal{background:white;border-radius:14px;max-width:520px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 24px 64px rgba(15,31,61,.3)}
.modal-header{background:var(--navy);color:white;padding:18px 24px;border-radius:14px 14px 0 0;display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-size:16px;font-weight:700}
.modal-close{background:rgba(255,255,255,.1);border:none;color:white;width:28px;height:28px;border-radius:6px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-body{padding:20px 24px}
.detail-row{display:grid;grid-template-columns:110px 1fr;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.detail-row:last-child{border-bottom:none}
.detail-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.detail-value{color:var(--text);line-height:1.6}
.modal-footer{padding:14px 24px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.btn-danger{background:var(--red-bg);color:var(--red);border:1.5px solid #fca5a5;font-family:"Noto Sans KR",sans-serif;font-size:12px;font-weight:600;padding:8px 14px;border-radius:7px;cursor:pointer}
.btn-danger:hover{background:var(--red);color:white}
.btn-pdf{background:var(--sky-light);color:var(--sky-dark);border:1.5px solid #bae6fd;font-family:"Noto Sans KR",sans-serif;font-size:12px;font-weight:600;padding:8px 14px;border-radius:7px;cursor:pointer}
.btn-pdf:hover{background:var(--sky);color:white}
.btn-edit{background:var(--green-bg);color:var(--green);border:1.5px solid #86efac;font-family:"Noto Sans KR",sans-serif;font-size:12px;font-weight:600;padding:8px 14px;border-radius:7px;cursor:pointer}
.btn-edit:hover{background:var(--green);color:white}
.btn-close-modal{background:var(--navy);color:white;border:none;font-family:"Noto Sans KR",sans-serif;font-size:12px;font-weight:600;padding:8px 16px;border-radius:7px;cursor:pointer}
.bottom-tab-bar{display:none}
.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:white;padding:12px 18px;border-radius:9px;font-size:13px;font-weight:500;border-left:4px solid var(--sky);transform:translateY(70px);opacity:0;transition:all .3s cubic-bezier(.34,1.56,.64,1);z-index:200}
.toast.show{transform:translateY(0);opacity:1}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
.av-1{background:#2563eb}.av-2{background:#7c3aed}.av-3{background:#0891b2}
.av-4{background:#059669}.av-5{background:#d97706}.av-6{background:#dc2626}
.av-7{background:#db2777}.av-8{background:#4f46e5}
@media(max-width:640px){
  body{flex-direction:column;overflow:auto}
  .main{overflow:auto}
  .topbar{padding:0 16px}
  .topbar-logo{display:block}
  .content{flex-direction:column;overflow:visible;flex:1}
  .form-panel{width:100%;border-right:none;overflow:visible}
  .form-panel.hidden{display:none}
  .records-panel{flex:1;overflow:visible}
  .records-list{overflow:visible;padding-bottom:80px}
  .form-body{padding-bottom:80px}
  .decision-grid{grid-template-columns:1fr 1fr}
  .form-row-3,.form-row{grid-template-columns:1fr}
  .bottom-tab-bar{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--border);z-index:50}
  .tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 8px;font-size:10px;font-weight:600;color:var(--muted);cursor:pointer;gap:4px;text-decoration:none;border:none;background:none;font-family:"Noto Sans KR",sans-serif}
  .tab-item .tab-icon{font-size:20px;line-height:1}
  .tab-item.active{color:var(--navy)}
}
</style>
</head>
<body>
<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <div class="login-card-header">
      <img src="https://koreayjk.github.io/into/intologo2.png" alt="인투유학">
      <p>Consultation Chart</p>
    </div>
    <div class="login-card-body">
      <label>¾ñ¼Ð¼ö</label>
      <label>비밀번호</label>
      <div class="login-input-wrap">
        <input type="password" id="loginPw" placeholder="비밀번호를 입력하세요" onkeydown="if(event.key==='Enter')doLogin()">
        <button class="toggle-pw" onclick="togglePw()" tabindex="-1">👁</button>
      </div>
      <div class="login-error" id="loginError"></div>
      <button class="login-btn" onclick="doLogin()">로그인</button>
    </div>
  </div>
</div>
<aside class="sidebar">
  <div class="sidebar-logo">
    <img src="https://koreayjk.github.io/into/intologo2.png" alt="인투유학">
    <p>Consultation Chart</p>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-label">메뉴</div>
    <button class="nav-item active" id="navForm" onclick="showView('form',this)"><span class="icon">📋</span> 신규 상담 등록</button>
    <button class="nav-item" id="navRecords" onclick="showView('records',this)"><span class="icon">📊</span> 상담 기록 목록</button>
    <button class="nav-item" id="navInquiry" onclick="showView('inquiry',this)"><span class="icon">📩</span> 상담 신청 목록</button>
    <div class="nav-label">설정</div>
    <a href="admin.html" class="nav-item"><span class="icon">⚙️</span> 관리자 설정</a>
  </nav>
  <div class="sidebar-stats">
    <div class="stat-row"><div class="stat-box"><div class="n" id="statTotal">0</div><div class="l">전체</div></div><div class="stat-box s-green"><div class="n" id="statYes">0</div><div class="l">진행 결정</div></div></div>
    <div class="stat-row"><div class="stat-box s-amber"><div class="n" id="statThink">0</div><div class="l">검토 중</div></div><div class="stat-box s-sky"><div class="n" id="statPend">0</div><div class="l">재연락</div></div></div>
  </div>
</aside>
<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <img src="https://koreayjk.github.io/into/intologo1.png" alt="인투유학" class="topbar-logo">
      <div class="topbar-title" id="topbarTitle">신규 상담 등록</div>
      <div class="topbar-badge" id="topBadge">0건</div>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-ghost" onclick="exportData()">📥 CSV</button>
      <button class="btn btn-ghost" onclick="exportPDF()">📄 PDF 출력</button>
    </div>
  </div>
  <div class="content">
    <div class="form-panel" id="formPanel">
      <div class="form-panel-header"><h2>신규 상담 등록</h2><p>새 상담 내용을 입력하세요</p></div>
      <div class="form-body" id="formBody">
        <div class="form-grid">
          <div class="form-row">
            <div class="fg"><label class="lbl">학생 이름</label><input type="text" id="name" placeholder="홍길동"></div>
            <div class="fg"><label class="lbl">연락처</label><input type="text" id="phone" placeholder="010-0000-0000"></div>
          </div>
          <div class="form-row-3">
            <div class="fg"><label class="lbl">상담 일자</label><input type="date" id="date"></div>
            <div class="fg"><label class="lbl">상담자</label><select id="consultant"></select></div>
            <div class="fg"><label class="lbl">유입 경로</label>
              <select id="channel" onchange="onChannelChange()"></select>
              <select id="channelSub" style="display:none;margin-top:6px;"></select>
            </div>
          </div>
          <div class="fg"><label class="lbl">상담 내용 요약</label><textarea id="notes" placeholder="학생의 목표, 관심 학교, 전공, 비자 문의 등..."></textarea></div>
          <div class="fg"><label class="lbl">결정 여부</label>
            <div class="decision-grid">
              <button class="dec-btn" onclick="selectDecision(this,'yes')">✅ 진행 결정</button>
              <button class="dec-btn" onclick="selectDecision(this,'thinking')">🤔 검토 중</button>
              <button class="dec-btn" onclick="selectDecision(this,'pending')">⏳ 재연락 예정</button>
              <button class="dec-btn" onclick="selectDecision(this,'no')">❌ 미진행</button>
            </div>
          </div>
          <div class="fg"><label class="lbl">팔로업 메모</label><input type="text" id="followup" placeholder="예: 5월 20일 재연락 예정..."></div>
        </div>
      </div>
      <div class="form-footer" id="formFooter">
        <button class="btn-reset" onclick="clearForm()">초기화</button>
        <button class="btn-save" onclick="saveRecord()">저장하기 →</button>
      </div>
    </div>
    <div class="records-panel hidden" id="recordsPanel">
      <div class="records-toolbar">
        <div class="search-wrap"><span class="search-icon">🔍</span><input type="text" id="searchInput" placeholder="이름, 연락처, 내용으로 검색..." oninput="renderRecords()"></div>
        <select class="filter-select" id="filterDecision" onchange="renderRecords()">
          <option value="">전체</option><option value="yes">진행 결정</option>
          <option value="thinking">검토 중</option><option value="pending">재연락</option><option value="no">미진행</option>
        </select>
        <div class="records-count" id="countBadge">0건</div>
      </div>
      <div class="records-list" id="recordsList"></div>
    </div>
    <div class="records-panel hidden" id="inquiryPanel">
      <div class="records-toolbar">
        <div class="search-wrap"><span class="search-icon">🔍</span><input type="text" id="inquirySearch" placeholder="이름, 연락처, 국가로 검색..." oninput="renderInquiries()"></div>
        <div class="records-count" id="inquiryCount">0건</div>
      </div>
      <div class="records-list" id="inquiryList"></div>
    </div>
  </div>
</div>
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header"><h3 id="modalName">상세 기록</h3><button class="modal-close" onclick="closeModalDirect()">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter">
      <button class="btn-danger" onclick="deleteRecord()">🗑 삭제</button>
      <button class="btn-pdf" onclick="exportSinglePDF()">📄 PDF</button>
      <button class="btn-edit" onclick="openEditModal()">✏️ 수정</button>
      <button class="btn-close-modal" onclick="closeModalDirect()">닫기</button>
    </div>
  </div>
</div>

  <div class="modal">
    <div class="modal-header"><h3>✏️ 상담 기록 수정</h3><button class="modal-close" onclick="closeEditModalDirect()">✕</button></div>

      <div style="display:flex;flex-direction:column;gap:12px;">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">

          <div class="fg"><label class="lbl">연락처</label><input type="text" id="editPhone"></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;">
          <div class="fg"><label class="lbl">상담 일자</label><input type="date" id="editDate"></div>
          <div class="fg"><label class="lbl">상담자</label><select id="editConsultant"></select></div>
          <div class="fg"><label class="lbl">유입 경로</label>
            <select id="editChannel" onchange="onEditChannelChange()"></select>
            <select id="editChannelSub" style="display:none;margin-top:6px;"></select>
          </div>
        </div>
        <div class="fg"><label class="lbl">상담 내용 요약</label><textarea id="editNotes" style="min-height:100px;"></textarea></div>
        <div class="fg"><label class="lbl">결정 여부</label>
          <div class="decision-grid" id="editDecisionGroup">
            <button class="dec-btn" onclick="selectEditDecision(this,'yes')">✅ 진행 결정</button>
            <button class="dec-btn" onclick="selectEditDecision(this,'thinking')">🤔 검토 중</button>
            <button class="dec-btn" onclick="selectEditDecision(this,'pending')">⏳ 재연락 예정</button>
            <button class="dec-btn" onclick="selectEditDecision(this,'no')">❌ 미진행</button>
          </div>
        </div>
        <div class="fg"><label class="lbl">팔로업 메모</label><input type="text" id="editFollowup"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-close-modal" onclick="closeEditModalDirect()">취소</button>
      <button class="btn-save" style="padding:8px 20px;border-radius:7px;" onclick="saveEdit()">💾 저장</button>
    </div>
  </div>
</div>
<div class="bottom-tab-bar">
  <button class="tab-item active" id="tabForm" onclick="showView('form',this,true)"><div class="tab-icon">📋</div><span>신규 등록</span></button>
  <button class="tab-item" id="tabRecords" onclick="showView('records',this,true)"><div class="tab-icon">📊</div><span>기록 목록</span></button>

  <a href="admin.html" class="tab-item"><div class="tab-icon">⚙️</div><span>관리자</span></a>
</div>
<div class="toast" id="toast"></div>
<script>
const PASSWORD='immission2414!!AA';
const SHEET_URL='https://script.google.com/macros/s/AKfycbzla7nk3JEMasIHJYvzJNCR2D4Bl8ZEJNM1dIiaUC9sVW6mjRJZQvyKE0WFTbIQUSSy/exec';
const DEFAULT={consultants:['Moses 목사님','스태프 A','스태프 B'],channels:['유튜브','인스타그램','카카오톡','네이버 검색','지인 소개','교회 연결','페이스북'],kcpa:['KCPA 멤버1','KCPA 멤버2','KCPA 멤버3','KCPA 멤버4','KCPA 멤버5'],academy:['학원1','학원2','학원3','학원4','학원5']};

// LOGIN
function checkLogin(){if(sessionStorage.getItem('into_auth')==='ok')document.getElementById('loginOverlay').classList.add('hidden')}
function doLogin(){const pw=document.getElementById('loginPw').value;if(pw===PASSWORD){sessionStorage.setItem('into_auth','ok');document.getElementById('loginOverlay').classList.add('hidden');document.getElementById('loginError').textContent=''}else{document.getElementById('loginError').textContent='❌ 비밀번호가 틀렸습니다.';document.getElementById('loginPw').value='';document.getElementById('loginPw').focus()}}
function togglePw(){const i=document.getElementById('loginPw');i.type=i.type==='password'?'text':'password'}
checkLogin();

// ADMIN
function getAdminData(){const s=JSON.parse(localStorage.getItem('admin_settings')||'null');return s||{consultants:DEFAULT.consultants,channels:DEFAULT.channels,kcpa:DEFAULT.kcpa,academy:DEFAULT.academy}}
async function loadAdminFromSheets(){try{const res=await fetch(SHEET_URL+'?type=admin&t='+Date.now(),{redirect:'follow'});const data=await res.json();if(data&&data.consultants){localStorage.setItem('admin_settings',JSON.stringify(data));populateSelects()}}catch(e){}}

// SELECTS
function populateSelects(){const a=getAdminData();document.getElementById('consultant').innerHTML='<option value="">선택</option>'+a.consultants.map(c=>`<option value="${c}">${c}</option>`).join('')+'<option value="기타">기타</option>';document.getElementById('channel').innerHTML='<option value="">선택</option>'+a.channels.map(c=>`<option value="${c}">${c}</option>`).join('')+'<option value="KCPA">KCPA</option><option value="학원">학원</option><option value="기타">기타</option>'}
function onChannelChange(){const v=document.getElementById('channel').value,s=document.getElementById('channelSub'),a=getAdminData();if(v==='KCPA'){s.style.display='block';s.innerHTML='<option value="">KCPA 멤버 선택</option>'+a.kcpa.map(m=>`<option value="KCPA - ${m}">${m}</option>`).join('')}else if(v==='학원'){s.style.display='block';s.innerHTML='<option value="">학원 멤버 선택</option>'+a.academy.map(m=>`<option value="학원 - ${m}">${m}</option>`).join('')}else{s.style.display='none';s.innerHTML=''}}
function getChannelValue(){const m=document.getElementById('channel').value,s=document.getElementById('channelSub');return(m==='KCPA'||m==='학원')&&s.style.display!=='none'&&s.value?s.value:m}

// RECORDS
let records=JSON.parse(localStorage.getItem('intoConsultations')||'[]');
let selectedDecision='',currentModalIndex=-1;
const AV=['av-1','av-2','av-3','av-4','av-5','av-6','av-7','av-8'];
const DL={yes:'✅ 진행 결정',no:'❌ 미진행',pending:'⏳ 재연락 예정',thinking:'🤔 검토 중','':'미정'};
const DC={yes:'db-yes',no:'db-no',pending:'db-pending',thinking:'db-thinking','':'db-'};
document.getElementById('date').valueAsDate=new Date();
populateSelects();loadAdminFromSheets();

function selectDecision(el,val){selectedDecision=val;document.querySelectorAll('.decision-grid:not(#editDecisionGroup) .dec-btn').forEach(b=>b.className='dec-btn');el.classList.add('sel-'+val)}
async function saveRecord(){
  const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim();
  if(!name){showToast('⚠️ 학생 이름을 입력해주세요.');return}if(!phone){showToast('⚠️ 연락처를 입력해주세요.');return}
  const dmap={yes:'진행 결정',no:'미진행',pending:'재연락 예정',thinking:'검토 중','':'미정'};
  const rec={id:Date.now(),name,phone,date:document.getElementById('date').value,consultant:document.getElementById('consultant').value,channel:getChannelValue(),notes:document.getElementById('notes').value.trim(),followup:document.getElementById('followup').value.trim(),decision:selectedDecision};
  records.unshift(rec);localStorage.setItem('intoConsultations',JSON.stringify(records));updateStats();renderRecords();clearForm();showToast('💾 저장 중...');
  try{await fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({...rec,decision:dmap[selectedDecision||'']})});showToast('✅ 저장 완료!')}catch{showToast('⚠️ 로컬 저장 완료.')}
}
function clearForm(){['name','phone','followup','notes'].forEach(id=>document.getElementById(id).value='');document.getElementById('date').valueAsDate=new Date();document.getElementById('consultant').value='';document.getElementById('channel').value='';document.getElementById('channelSub').style.display='none';document.getElementById('channelSub').innerHTML='';document.querySelectorAll('.decision-grid:not(#editDecisionGroup) .dec-btn').forEach(b=>b.className='dec-btn');selectedDecision=''}
function updateStats(){const t=records.length;document.getElementById('statTotal').textContent=t;document.getElementById('statYes').textContent=records.filter(r=>r.decision==='yes').length;document.getElementById('statThink').textContent=records.filter(r=>r.decision==='thinking').length;document.getElementById('statPend').textContent=records.filter(r=>r.decision==='pending').length;document.getElementById('topBadge').textContent=t+'건'}
function renderRecords(){
  const search=document.getElementById('searchInput').value.toLowerCase(),filter=document.getElementById('filterDecision').value,list=document.getElementById('recordsList');
  let filtered=records.filter(r=>(!search||(r.name||'').toLowerCase().includes(search)||(r.phone||'').includes(search)||((r.notes||'').toLowerCase().includes(search)))&&(!filter||r.decision===filter));
  document.getElementById('countBadge').textContent=filtered.length+'건';
  if(!filtered.length){list.innerHTML=`<div class="empty-state"><div class="ei">📋</div><p>${records.length===0?'아직 등록된 상담이 없습니다.':'검색 결과가 없습니다.'}</p></div>`;return}
  list.innerHTML=filtered.map(r=>{const i=records.indexOf(r),av=AV[(r.name.charCodeAt(0)||0)%8];return`<div class="record-item" onclick="openModal(${i})"><div class="record-avatar ${av}">${r.name.charAt(0)}</div><div class="record-body"><div class="record-name">${r.name}<span class="record-phone">${r.phone}</span></div><div class="record-tags">${r.date?`<span class="rtag rtag-date">📅 ${r.date}</span>`:''}${r.channel?`<span class="rtag rtag-ch">📌 ${r.channel}</span>`:''}${r.consultant?`<span class="rtag rtag-co">👤 ${r.consultant}</span>`:''}</div>${r.notes?`<div class="record-note">${r.notes}</div>`:''}</div><div class="record-right"><div class="record-num">#${String(records.length-i).padStart(3,'0')}</div><div class="dec-badge ${DC[r.decision||'']}">${DL[r.decision||'']}</div></div></div>`}).join('');
}
function openModal(idx){currentModalIndex=idx;const r=records[idx];document.getElementById('modalName').textContent=r.name+' 님 상담 기록';document.getElementById('modalBody').innerHTML=`<div class="detail-row"><div class="detail-label">이름</div><div class="detail-value">${r.name}</div></div><div class="detail-row"><div class="detail-label">연락처</div><div class="detail-value">${r.phone}</div></div><div class="detail-row"><div class="detail-label">상담 일자</div><div class="detail-value">${r.date||'미기재'}</div></div><div class="detail-row"><div class="detail-label">상담자</div><div class="detail-value">${r.consultant||'미기재'}</div></div><div class="detail-row"><div class="detail-label">유입 경로</div><div class="detail-value">${r.channel||'미기재'}</div></div><div class="detail-row"><div class="detail-label">상담 내용</div><div class="detail-value" style="white-space:pre-wrap;">${r.notes||'없음'}</div></div><div class="detail-row"><div class="detail-label">결정 여부</div><div class="detail-value">${DL[r.decision||'']}</div></div><div class="detail-row"><div class="detail-label">팔로업</div><div class="detail-value">${r.followup||'없음'}</div></div>`;document.getElementById('modalFooter').innerHTML='<button class="btn-danger" onclick="deleteRecord()">🗑 삭제</button><button class="btn-pdf" onclick="exportSinglePDF()">📄 PDF</button><button class="btn-edit" onclick="openEditModal()">✏️ 수정</button><button class="btn-close-modal" onclick="closeModalDirect()">닫기</button>';document.getElementById('modalOverlay').classList.add('open')}
function closeModal(e){if(e.target===document.getElementById('modalOverlay'))closeModalDirect()}
function closeModalDirect(){document.getElementById('modalOverlay').classList.remove('open');currentModalIndex=-1}
async function deleteRecord(){if(currentModalIndex<0)return;if(!confirm('삭제하시겠습니까?'))return;const rec=records[currentModalIndex];records.splice(currentModalIndex,1);localStorage.setItem('intoConsultations',JSON.stringify(records));closeModalDirect();updateStats();renderRecords();showToast('🗑️ 삭제 중...');try{await fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'delete',id:String(rec.id)})});showToast('✅ 삭제 완료!')}catch{showToast('⚠️ 로컬 삭제 완료.')}}

// EDIT
let editDecision='';
function openEditModal(){if(currentModalIndex<0)return;const r=records[currentModalIndex],a=getAdminData();document.getElementById('editConsultant').innerHTML='<option value="">선택</option>'+a.consultants.map(c=>`<option value="${c}">${c}</option>`).join('')+'<option value="기타">기타</option>';document.getElementById('editChannel').innerHTML='<option value="">선택</option>'+a.channels.map(c=>`<option value="${c}">${c}</option>`).join('')+'<option value="KCPA">KCPA</option><option value="학원">학원</option><option value="기타">기타</option>';document.getElementById('editName').value=r.name||'';document.getElementById('editPhone').value=r.phone||'';document.getElementById('editDate').value=r.date||'';document.getElementById('editConsultant').value=r.consultant||'';document.getElementById('editFollowup').value=r.followup||'';document.getElementById('editNotes').value=r.notes||'';const sub=document.getElementById('editChannelSub');sub.style.display='none';sub.innerHTML='';if(r.channel&&r.channel.includes(' - ')){const parts=r.channel.split(' - ');document.getElementById('editChannel').value=parts[0];onEditChannelChange();setTimeout(()=>{sub.value=r.channel},50)}else{document.getElementById('editChannel').value=r.channel||''}editDecision=r.decision||'';document.querySelectorAll('#editDecisionGroup .dec-btn').forEach(b=>b.className='dec-btn');const sel=document.querySelector(`#editDecisionGroup .dec-btn[onclick*="'${editDecision}'"]`);if(sel)sel.classList.add('sel-'+editDecision);document.getElementById('editModalOverlay').classList.add('open')}
function onEditChannelChange(){const v=document.getElementById('editChannel').value,s=document.getElementById('editChannelSub'),a=getAdminData();if(v==='KCPA'){s.style.display='block';s.innerHTML='<option value="">KCPA 멤버 선택</option>'+a.kcpa.map(m=>`<option value="KCPA - ${m}">${m}</option>`).join('')}else if(v==='학원'){s.style.display='block';s.innerHTML='<option value="">학원 멤버 선택</option>'+a.academy.map(m=>`<option value="학원 - ${m}">${m}</option>`).join('')}else{s.style.display='none';s.innerHTML=''}}
function selectEditDecision(el,val){editDecision=val;document.querySelectorAll('#editDecisionGroup .dec-btn').forEach(b=>b.className='dec-btn');el.classList.add('sel-'+val)}
function getEditChannelValue(){const m=document.getElementById('editChannel').value,s=document.getElementById('editChannelSub');return(m==='KCPA'||m==='학원')&&s.style.display!=='none'&&s.value?s.value:m}
async function saveEdit(){if(currentModalIndex<0)return;const r=records[currentModalIndex],dmap={yes:'진행 결정',no:'미진행',pending:'재연락 예정',thinking:'검토 중','':'미정'},updated={...r,name:document.getElementById('editName').value.trim(),phone:document.getElementById('editPhone').value.trim(),date:document.getElementById('editDate').value,consultant:document.getElementById('editConsultant').value,channel:getEditChannelValue(),notes:document.getElementById('editNotes').value.trim(),followup:document.getElementById('editFollowup').value.trim(),decision:editDecision};if(!updated.name){showToast('⚠️ 이름을 입력해주세요.');return}records[currentModalIndex]=updated;localStorage.setItem('intoConsultations',JSON.stringify(records));closeEditModalDirect();updateStats();renderRecords();showToast('💾 수정 중...');try{await fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'update',...updated,decision:dmap[editDecision||'']})});showToast('✅ 수정 완료!')}catch{showToast('⚠️ 로컬 수정 완료.')}}
function closeEditModal(e){if(e.target===document.getElementById('editModalOverlay'))closeEditModalDirect()}
function closeEditModalDirect(){document.getElementById('editModalOverlay').classList.remove('open')}

// INQUIRY
let inquiries=[];
async function loadInquiries(){try{const res=await fetch(SHEET_URL+'?type=inquiry&t='+Date.now(),{redirect:'follow'});const data=await res.json();if(Array.isArray(data)){inquiries=data;renderInquiries()}}catch{document.getElementById('inquiryList').innerHTML='<div class="empty-state"><div class="ei">📩</div><p>데이터를 불러올 수 없습니다.</p></div>'}}
function renderInquiries(){const search=document.getElementById('inquirySearch').value.toLowerCase(),list=document.getElementById('inquiryList'),filtered=inquiries.filter(r=>!search||(r['이름']||'').toLowerCase().includes(search)||(r['연락처']||'').toLowerCase().includes(search)||(r['관심국가']||'').toLowerCase().includes(search));document.getElementById('inquiryCount').textContent=filtered.length+'건';if(!filtered.length){list.innerHTML='<div class="empty-state"><div class="ei">📩</div><p>신청 내역이 없습니다.</p></div>';return}list.innerHTML=filtered.map((r,i)=>`<div class="inquiry-item" onclick="openInquiryModal(${i})"><div class="inquiry-header"><div class="inquiry-name">${r['이름']||'-'} <span style="font-weight:400;color:var(--muted);font-size:12px;">${r['연락처']||r['카카오톡ID']||''}</span></div><div class="inquiry-date">${String(r['신청일시']||'').substring(0,16)}</div></div><div class="inquiry-tags">${r['관심국가']?`<span class="rtag rtag-ch">🌏 ${r['관심국가']}</span>`:''}${r['카카오톡ID']?`<span class="rtag rtag-co">💬 ${r['카카오톡ID']}</span>`:''}${r['학년']?`<span class="rtag rtag-date">🎓 ${r['학년']}</span>`:''}</div>${r['문의내용']?`<div class="inquiry-note">${r['문의내용']}</div>`:''}</div>`).join('')}
function openInquiryModal(idx){const r=inquiries[idx];document.getElementById('modalName').textContent=(r['이름']||'-')+' 님 상담 신청';document.getElementById('modalBody').innerHTML=`<div class="detail-row"><div class="detail-label">이름</div><div class="detail-value">${r['이름']||'-'}</div></div><div class="detail-row"><div class="detail-label">연락처</div><div class="detail-value">${r['연락처']||'-'}</div></div><div class="detail-row"><div class="detail-label">카카오톡 ID</div><div class="detail-value">${r['카카오톡ID']||'-'}</div></div><div class="detail-row"><div class="detail-label">학년/나이</div><div class="detail-value">${r['학년']||'-'}</div></div><div class="detail-row"><div class="detail-label">관심 국가</div><div class="detail-value">${r['관심국가']||'-'}</div></div><div class="detail-row"><div class="detail-label">문의 내용</div><div class="detail-value" style="white-space:pre-wrap;">${r['문의내용']||'-'}</div></div><div class="detail-row"><div class="detail-label">개인정보 동의</div><div class="detail-value">${r['개인정보동의']||'-'}</div></div><div class="detail-row"><div class="detail-label">신청 일시</div><div class="detail-value">${r['신청일시']||'-'}</div></div>`;document.getElementById('modalFooter').innerHTML='<button class="btn-close-modal" onclick="closeModalDirect()">닫기</button>';document.getElementById('modalOverlay').classList.add('open')}

// VIEW
function showView(v,el,fromTab){document.querySelectorAll('.nav-item,.tab-item').forEach(n=>n.classList.remove('active'));if(el)el.classList.add('active');const nm={form:'navForm',records:'navRecords',inquiry:'navInquiry'},tm={form:'tabForm',records:'tabRecords',inquiry:'tabInquiry'};const se=document.getElementById(nm[v]);if(se)se.classList.add('active');const te=document.getElementById(tm[v]);if(te)te.classList.add('active');const fp=document.getElementById('formPanel'),rp=document.getElementById('recordsPanel'),ip=document.getElementById('inquiryPanel');fp.classList.add('hidden');rp.classList.add('hidden');ip.classList.add('hidden');fp.style.width='';fp.style.borderRight='';const fb=document.getElementById('formBody'),ff=document.getElementById('formFooter');if(v==='form'){fp.classList.remove('hidden');fp.style.width='100%';fp.style.borderRight='none';if(fb){fb.style.maxWidth='none';fb.style.margin='0'}if(ff){ff.style.maxWidth='none';ff.style.margin='0';ff.style.width='100%'}document.getElementById('topbarTitle').textContent='신규 상담 등록'}else if(v==='records'){rp.classList.remove('hidden');if(fb){fb.style.maxWidth='';fb.style.margin=''}if(ff){ff.style.maxWidth='';ff.style.margin='';ff.style.width=''}document.getElementById('topbarTitle').textContent='상담 기록 목록'}else if(v==='inquiry'){ip.classList.remove('hidden');document.getElementById('topbarTitle').textContent='상담 신청 목록';setTimeout(loadInquiries,0)}}

// SHEETS
async function loadFromSheets(){try{const res=await fetch(SHEET_URL+'?t='+Date.now(),{redirect:'follow'});const data=await res.json();if(!Array.isArray(data)||!data.length)return;const dm={'진행 결정':'yes','검토 중':'thinking','재연락 예정':'pending','미진행':'no'};const loaded=data.map(r=>({id:r['id']||Date.now()+Math.random(),name:r['이름']||'',phone:r['연락처']||'',date:String(r['상담일자']||'').substring(0,10),consultant:r['상담자']||'',channel:r['유입경로']||'',notes:r['상담내용']||'',decision:dm[r['결정여부']]||'',followup:r['팔로업']||''})).filter(r=>r.name);if(loaded.length){records=loaded.reverse();localStorage.setItem('intoConsultations',JSON.stringify(records));updateStats();renderRecords();showToast('✅ 최신 데이터 불러옴 ('+records.length+'건)')}}catch{}}

// CSV
function exportData(){if(!records.length){showToast('⚠️ 내보낼 기록이 없습니다.');return}const dl={yes:'진행 결정',no:'미진행',pending:'재연락 예정',thinking:'검토 중','':'미정'},h=['번호','이름','연락처','상담일자','상담자','유입경로','상담내용','결정여부','팔로업'],q=s=>'"'+(s||'').toString().replace(/"/g,'""')+'"';const rows=records.map((r,i)=>[records.length-i,r.name,r.phone,r.date,r.consultant,r.channel,q(r.notes),dl[r.decision||''],q(r.followup)].join(','));const csv='\uFEFF'+h.join(',')+'\n'+rows.join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download='INTO유학CENTER_상담기록.csv';a.click();showToast('📥 CSV 다운로드 완료!')}

// TOAST
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800)}

th><th>상담내용</th><th>결정여부</th><th>팔로업</th></tr></thead><tbody>${rows}</tbody></table><div class="ft"><span>INTO유학CENTER</span><span>${today}</span></div></body></html>`)}
function exportSinglePDF(){if(currentModalIndex<0)return;const r=records[currentModalIndex],today=new Date().toLocaleDateString('ko-KR');buildPrint(`<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><style>body{font-family:"Noto Sans CJK KR",sans-serif;padding:40px;max-width:580px;margin:0 auto}.top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #0f2a47;padding-bottom:12px;margin-bottom:8px}.lb{background:#0f2a47;padding:6px 14px;border-radius:6px}.lb img{height:32px;width:auto;display:block}.bar{height:4px;background:linear-gradient(90deg,#0f2a47,#38bdf8);border-radius:2px;margin-bottom:24px}.title{font-size:16px;font-weight:700;margin-bottom:20px;padding-bottom:10px;border-bottom:1px dashed #e2e8f0}.grid{display:grid;grid-template-columns:120px 1fr}.lbl{font-size:9px;font-weight:700;text-transform:uppercase;color:#94a3b8;padding:11px 0;border-bottom:1px solid #f1f5f9}.val{font-size:13px;padding:11px 0;border-bottom:1px solid #f1f5f9;line-height:1.6}.ft{margin-top:28px;display:flex;justify-content:space-between;font-size:10px;color:#94a3b8;border-top:1px solid #e2e8f0;padding-top:10px}@media print{@page{margin:20mm;size:A4}body{padding:0}}</style></head><body><div class="top"><div class="lb"><img src="${LOGO_PDF}" alt="인투유학"></div><span style="font-size:11px;color:#94a3b8">${today}</span></div><div class="bar"></div><div class="title">📋 ${r.name} 님 상담 기록</div><div class="grid"><div class="lbl">이름</div><div class="val">${r.name}</div><div class="lbl">연락처</div><div class="val">${r.phone}</div><div class="lbl">상담 일자</div><div class="val">${r.date||'미기재'}</div><div class="lbl">상담자</div><div class="val">${r.consultant||'미기재'}</div><div class="lbl">유입 경로</div><div class="val">${r.channel||'미기재'}</div><div class="lbl">상담 내용</div><div class="val">${(r.notes||'없음').replace(/\n/g,'<br>')}</div><div class="lbl">결정 여부</div><div class="val">${DLM[r.decision||'']}</div><div class="lbl">팔로업</div><div class="val">${r.followup||'없음'}</div></div><div class="ft"><span>INTO유학CENTER</span><span>${today}</span></div></body></html>`)}
