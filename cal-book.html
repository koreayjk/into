<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상담 예약</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0a1f3c;--navy2:#142d54;--gold:#c9a84c;--gold-light:#f0dfa0;
  --sky:#4facde;--sky-light:#e8f4fd;
  --bg:#f7f8fc;--white:#fff;--border:#e8ecf2;
  --text:#0a1f3c;--muted:#7a8ba0;
  --green:#1a9e6b;--green-bg:#e6f7f1;
  --red:#d63b3b;--red-bg:#fdf0f0;
}
body{font-family:"Noto Sans KR",sans-serif;background:var(--bg);min-height:100vh;color:var(--text)}

/* HERO */
.hero{
  background:linear-gradient(160deg, var(--navy) 0%, var(--navy2) 60%, #1a3a6b 100%);
  padding:40px 20px 48px;
  text-align:center;
  position:relative;
  overflow:hidden;
}
.hero::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 30% 50%, rgba(201,168,76,.12) 0%, transparent 60%),
             radial-gradient(ellipse at 70% 20%, rgba(79,172,222,.1) 0%, transparent 50%);
}
.hero-logo{
  height:68px;width:auto;display:block;margin:0 auto 24px;
  mix-blend-mode:lighten;position:relative;z-index:1;
  filter:drop-shadow(0 4px 16px rgba(201,168,76,.3));
}
.host-avatar{
  width:76px;height:76px;border-radius:50%;
  margin:0 auto 14px;display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:900;color:white;
  border:3px solid rgba(201,168,76,.5);
  box-shadow:0 8px 32px rgba(0,0,0,.3);
  position:relative;z-index:1;
}
.host-name{
  font-family:"Playfair Display",serif;
  font-size:24px;font-weight:700;color:white;margin-bottom:6px;
  position:relative;z-index:1;letter-spacing:.5px;
}
.meeting-title{font-size:14px;color:rgba(255,255,255,.65);margin-bottom:12px;position:relative;z-index:1;}
.meeting-badges{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;position:relative;z-index:1;}
.badge{
  font-size:12px;padding:5px 14px;border-radius:20px;
  background:rgba(201,168,76,.2);color:var(--gold-light);
  font-weight:600;border:1px solid rgba(201,168,76,.3);
  backdrop-filter:blur(8px);
}

/* STEP INDICATOR */
.step-bar{
  display:flex;align-items:center;justify-content:center;
  padding:20px;background:white;
  border-bottom:1px solid var(--border);
  gap:0;
}
.si{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.si.active{color:var(--navy)}
.si.done{color:var(--green)}
.si-dot{
  width:26px;height:26px;border-radius:50%;
  background:var(--border);color:var(--muted);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;transition:all .3s;
}
.si.active .si-dot{background:var(--navy);color:white;box-shadow:0 4px 12px rgba(10,31,60,.3)}
.si.done .si-dot{background:var(--green);color:white}
.si-line{width:32px;height:2px;background:var(--border);margin:0 4px}
.si.done+.si-line{background:var(--green)}

/* WRAP */
.wrap{max-width:560px;margin:0 auto;padding:24px 16px 80px}

/* CARD */
.card{
  background:white;border-radius:16px;
  box-shadow:0 2px 24px rgba(10,31,60,.07);
  margin-bottom:16px;overflow:hidden;
  border:1px solid var(--border);
}
.card-header{
  background:linear-gradient(135deg,var(--navy),var(--navy2));
  padding:16px 20px;display:flex;align-items:center;gap:10px;
}
.card-header h2{color:white;font-size:14px;font-weight:700;letter-spacing:.3px}

/* CALENDAR */
.cal-wrap{padding:20px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.cal-nav-btn{
  width:34px;height:34px;border-radius:50%;
  border:1.5px solid var(--border);background:white;
  cursor:pointer;font-size:16px;color:var(--navy);
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.cal-nav-btn:hover{border-color:var(--navy);background:var(--sky-light)}
.cal-title{font-size:16px;font-weight:700;color:var(--navy);font-family:"Playfair Display",serif}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-lbl{text-align:center;font-size:10px;font-weight:700;color:var(--muted);padding:6px 0;letter-spacing:.5px}
.cal-day{
  text-align:center;padding:9px 3px;border-radius:10px;
  font-size:13px;min-height:40px;
  display:flex;align-items:center;justify-content:center;
  position:relative;transition:all .15s;
}
.cal-day.avail{cursor:pointer;font-weight:600;color:var(--navy)}
.cal-day.avail:hover{background:var(--sky-light);transform:scale(1.05)}
.cal-day.selected{
  background:linear-gradient(135deg,var(--navy),var(--navy2))!important;
  color:white!important;font-weight:700;
  box-shadow:0 4px 14px rgba(10,31,60,.3);
  transform:scale(1.05);
}
.cal-day.today{color:var(--gold);font-weight:700}
.cal-day.unavail{color:#d0d8e4;cursor:default}
.cal-day.avail::after{
  content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--gold);
}
.cal-day.selected::after{background:rgba(255,255,255,.7)}

/* TIME SLOTS */
.time-wrap{padding:0 20px 20px}
.slot-date{
  font-size:11px;font-weight:700;color:var(--muted);
  letter-spacing:1px;text-transform:uppercase;margin-bottom:14px;
  padding-bottom:10px;border-bottom:1px solid var(--border);
}
.slot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{
  border:1.5px solid var(--border);border-radius:10px;
  padding:12px;text-align:center;cursor:pointer;
  font-size:13px;font-weight:600;transition:all .2s;
  color:var(--navy);background:white;
}
.slot:hover{border-color:var(--sky);background:var(--sky-light);transform:translateY(-1px);box-shadow:0 4px 12px rgba(79,172,222,.2)}
.slot.selected{
  background:linear-gradient(135deg,var(--navy),var(--navy2));
  border-color:var(--navy);color:white;
  transform:translateY(-2px);
  box-shadow:0 6px 18px rgba(10,31,60,.25);
}
.slot.booked{
  background:#f8f9fb;color:#c8d0db;
  cursor:not-allowed;border-color:#eef0f4;
}

/* FORM */
.form-wrap{padding:20px}
.summary{
  background:linear-gradient(135deg,var(--sky-light),#f0f6fd);
  border:1px solid #bdd9f0;border-radius:12px;
  padding:16px;margin-bottom:20px;
}
.sum-row{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;border-bottom:1px solid rgba(79,172,222,.15)}
.sum-row:last-child{border:none}
.sum-label{color:var(--muted);font-size:12px}
.sum-value{font-weight:700;color:var(--navy)}
.fg{margin-bottom:14px}
label.lbl{display:block;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input[type=text],input[type=tel],input[type=email],select,textarea{
  font-family:"Noto Sans KR",sans-serif;font-size:13px;color:var(--text);
  background:#f8f9fc;border:1.5px solid var(--border);border-radius:10px;
  padding:11px 14px;outline:none;transition:all .2s;width:100%;
}
input:focus,textarea:focus,select:focus{
  background:white;border-color:var(--sky);
  box-shadow:0 0 0 3px rgba(79,172,222,.12);
}
textarea{resize:vertical;min-height:80px}
.privacy-note{
  font-size:11px;color:var(--muted);line-height:1.7;
  padding:10px 14px;background:#f8f9fc;border-radius:8px;margin-top:4px;
}

/* BUTTONS */
.btn-row{display:flex;gap:10px}
.btn-primary{
  flex:1;font-family:"Noto Sans KR",sans-serif;
  font-size:14px;font-weight:700;padding:14px;border-radius:12px;
  background:linear-gradient(135deg,var(--navy),var(--navy2));
  color:white;border:none;cursor:pointer;
  transition:all .2s;letter-spacing:.3px;
  box-shadow:0 4px 14px rgba(10,31,60,.25);
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(10,31,60,.3)}
.btn-primary:disabled{background:#c8d0db;cursor:not-allowed;box-shadow:none;transform:none}
.btn-secondary{
  font-family:"Noto Sans KR",sans-serif;
  font-size:13px;padding:14px 20px;border-radius:12px;
  background:white;color:var(--muted);
  border:1.5px solid var(--border);cursor:pointer;
  transition:all .15s;
}
.btn-secondary:hover{border-color:var(--navy);color:var(--navy)}

/* SUCCESS */
.success{text-align:center;padding:48px 20px}
.s-icon{font-size:64px;margin-bottom:20px;animation:bounce .6s ease}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.s-title{font-family:"Playfair Display",serif;font-size:24px;font-weight:700;color:var(--navy);margin-bottom:10px}
.s-sub{font-size:14px;color:var(--muted);line-height:1.8;margin-bottom:24px}
.s-card{
  background:linear-gradient(135deg,var(--sky-light),#f0f6fd);
  border:1px solid #bdd9f0;border-radius:14px;
  padding:20px;margin-bottom:20px;text-align:left;
}
.s-row{display:flex;gap:14px;padding:7px 0;border-bottom:1px solid rgba(79,172,222,.15);font-size:13px}
.s-row:last-child{border:none}
.s-row .sl{color:var(--muted);min-width:80px;font-size:12px;font-weight:600}
.s-row .sv{font-weight:700;color:var(--navy)}
.btn-cancel-booking{
  font-family:"Noto Sans KR",sans-serif;font-size:13px;
  padding:11px 20px;border-radius:10px;
  background:white;color:var(--red);
  border:1.5px solid var(--red);cursor:pointer;
  width:100%;transition:all .15s;margin-top:8px;
}
.btn-cancel-booking:hover{background:var(--red-bg)}

.not-found{text-align:center;padding:80px 20px;color:var(--muted)}
.not-found-icon{font-size:56px;margin-bottom:16px;opacity:.5}

.toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--navy);color:white;padding:13px 22px;
  border-radius:30px;font-size:13px;font-weight:600;
  box-shadow:0 8px 28px rgba(10,31,60,.3);
  opacity:0;transition:all .35s cubic-bezier(.34,1.56,.64,1);z-index:200;
  white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

@media(max-width:480px){
  .slot-grid{grid-template-columns:repeat(2,1fr)}
  .btn-row{flex-direction:column}
  .host-name{font-size:20px}
}
</style>
</head>
<body>
<div id="app"><div style="text-align:center;padding:100px 20px;color:var(--muted)"><div style="font-size:32px;margin-bottom:12px">⏳</div><p style="font-size:14px">로딩 중...</p></div></div>
<div class="toast" id="toast"></div>
<script>
const SUPA_URL = 'https://illbgsjvhsciougzjgwn.supabase.co';
const SUPA_KEY = 'sb_publishable_EmIn4ZpTksxxbq7vXWTk4w_Wc38j9yH';
const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);

const params = new URLSearchParams(location.search);
const username = params.get('u');
const meetingSlug = params.get('m');

let hostProfile = null, meetingType = null, availabilities = [], bookedSlots = [];
let selectedDate = null, selectedSlot = null;
let currentYear, currentMonth;

async function init() {
  if (!username || !meetingSlug) { showNotFound(); return; }
  const now = new Date();
  currentYear = now.getFullYear();
  currentMonth = now.getMonth();

  const {data:profile} = await sb.from('consultant_profiles').select('*').eq('username', username).single();
  if (!profile) { showNotFound(); return; }
  hostProfile = profile;

  const {data:mt} = await sb.from('meeting_types').select('*').eq('slug', meetingSlug).eq('user_id', profile.id).single();
  if (!mt || !mt.is_active) { showNotFound(); return; }
  meetingType = mt;

  const {data:avail} = await sb.from('availabilities').select('*').eq('meeting_type_id', mt.id);
  availabilities = avail || [];

  const {data:bookings} = await sb.from('bookings').select('date,start_time').eq('meeting_type_id', mt.id).neq('status','cancelled');
  bookedSlots = bookings || [];

  renderHero();
  renderStep(1);
}

function showNotFound() {
  document.getElementById('app').innerHTML = `<div class="not-found"><div style="font-size:48px;margin-bottom:16px">😕</div><p>예약 페이지를 찾을 수 없습니다.</p></div>`;
}

function renderHero() {
  const color = meetingType.color || '#0f2a47';
  document.title = `${hostProfile.name} — ${meetingType.title}`;
  document.getElementById('app').innerHTML = `
  <div class="hero">
    <div class="hero-inner">
      <img src="https://koreayjk.github.io/into/intologo2.png" alt="인투유학" class="hero-logo">
      <div class="host-avatar" style="background:linear-gradient(135deg,${color},rgba(255,255,255,.15))">${hostProfile.name.charAt(0)}</div>
      <div class="host-name">${hostProfile.name}</div>
      <div class="meeting-title">${meetingType.title}</div>
      <div class="meeting-badges">
        <span class="badge">⏱ ${meetingType.duration_minutes}분</span>
        ${meetingType.description ? `<span class="badge">💬 ${meetingType.description}</span>` : ''}
      </div>
    </div>
  </div>
  <div id="stepIndicator" class="step-bar">
    <div class="si active" id="si1"><div class="si-dot">1</div> <span>날짜선택</span></div>
    <div class="si-line"></div>
    <div class="si" id="si2"><div class="si-dot">2</div> <span>시간선택</span></div>
    <div class="si-line"></div>
    <div class="si" id="si3"><div class="si-dot">3</div> <span>정보입력</span></div>
  </div>
  <div class="wrap" id="stepContent"></div>`;
  renderStep(1);
}

function renderStep(n) {
  [1,2,3].forEach(i => {
    const el = document.getElementById('si'+i);
    if (!el) return;
    el.className = 'si' + (i<n?' done':i===n?' active':'');
  });
  const c = document.getElementById('stepContent');
  if (n===1) renderCalendar(c);
  else if (n===2) renderTimeSlots(c);
  else if (n===3) renderForm(c);
  else renderSuccess(c);
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderCalendar(c) {
  const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const today = new Date();
  const firstDay = new Date(currentYear, currentMonth, 1).getDay();
  const daysInMonth = new Date(currentYear, currentMonth+1, 0).getDate();
  const availDays = new Set(availabilities.map(a=>a.day_of_week));

  let days = '';
  for (let i=0;i<firstDay;i++) days += '<div class="cal-day"></div>';
  for (let d=1;d<=daysInMonth;d++) {
    const date = new Date(currentYear, currentMonth, d);
    const ds = fmtDate(date);
    const isPast = date < new Date(today.getFullYear(),today.getMonth(),today.getDate());
    // 예약 가능 기간 제한
    const maxDays = meetingType.booking_range_days || 30;
    const maxDate = new Date(today.getFullYear(),today.getMonth(),today.getDate() + maxDays);
    const isTooFar = date > maxDate;
    const avail = availDays.has(date.getDay()) && !isPast && !isTooFar;
    const sel = ds===selectedDate;
    const isToday = date.toDateString()===today.toDateString();
    let cls='cal-day'+(avail?' avail':'  unavail')+(sel?' selected':'')+(isToday?' today':'');
    days += `<div class="${cls}" ${avail?`onclick="selectDate('${ds}')"`:''}>${d}</div>`;
  }

  c.innerHTML = `
  <div class="card">
    <div class="card-header"><h2>📅 날짜를 선택하세요</h2></div>
    <div class="cal-wrap">
      <div class="cal-nav">
        <button class="cal-nav-btn" onclick="prevMonth()">‹</button>
        <div class="cal-title">${currentYear}년 ${months[currentMonth]}</div>
        <button class="cal-nav-btn" onclick="nextMonth()">›</button>
      </div>
      <div class="cal-grid">
        ${['일','월','화','수','목','금','토'].map(d=>`<div class="cal-lbl">${d}</div>`).join('')}
        ${days}
      </div>
    </div>
  </div>`;
}

function selectDate(ds) {
  selectedDate = ds; selectedSlot = null;
  renderStep(2);
}
function prevMonth(){currentMonth--;if(currentMonth<0){currentMonth=11;currentYear--;}renderStep(1);}
function nextMonth(){currentMonth++;if(currentMonth>11){currentMonth=0;currentYear++;}renderStep(1);}

function renderTimeSlots(c) {
  const date = new Date(selectedDate);
  const dow = date.getDay();
  const avail = availabilities.find(a=>a.day_of_week===dow);
  const slots = generateSlots(avail?.start_time||'09:00', avail?.end_time||'18:00', meetingType.duration_minutes);
  const booked = new Set(bookedSlots.filter(b=>b.date===selectedDate).map(b=>b.start_time));
  // 최소 예약 시간 체크
  const minNoticeHours = meetingType.min_notice_hours || 0;
  const bufferMins = meetingType.buffer_minutes || 0;
  const nowPlus = new Date(Date.now() + minNoticeHours * 3600000);
  const buffer = meetingType.buffer_minutes || 0;
  const days=['일','월','화','수','목','금','토'];

  c.innerHTML = `
  <div class="card">
    <div class="card-header"><h2>⏰ 시간을 선택하세요</h2></div>
    <div class="time-wrap">
      <div class="slot-date">${selectedDate} (${days[dow]}) — ${slots.length}개 슬롯</div>
      <div class="slot-grid">
        ${slots.map(s => {
          const isBooked = booked.has(s.start);
          // 최소 예약 시간 체크
          const slotDateTime = new Date(selectedDate + 'T' + s.start + ':00');
          const isTooSoon = minNoticeHours > 0 && slotDateTime < nowPlus;
          // 버퍼 체크
          const isBuffered = bufferMins > 0 && [...booked].some(bt => {
            const bookedMins = parseInt(bt.split(':')[0])*60 + parseInt(bt.split(':')[1]);
            const slotMins = parseInt(s.start.split(':')[0])*60 + parseInt(s.start.split(':')[1]);
            return Math.abs(bookedMins - slotMins) < bufferMins && bookedMins !== slotMins;
          });
          const disabled = isBooked || isTooSoon || isBuffered;
          const isSel = selectedSlot?.start===s.start;
          return `<div class="slot${disabled?' booked':isSel?' selected':''}" ${!disabled?`onclick="selectSlot('${s.start}','${s.end}',this)"`:''}>
            ${s.start}${isTooSoon?' 🔒':''}
          </div>`;
        }).join('')}
      </div>
    </div>
  </div>
  <div class="btn-row" style="padding:0 0 16px">
    <button class="btn-secondary" onclick="renderStep(1)">← 이전</button>
    <button class="btn-primary" id="step2Next" onclick="renderStep(3)" ${selectedSlot?'':'disabled'}>다음 →</button>
  </div>`;
}

function selectSlot(start, end, el) {
  selectedSlot = {start, end};
  document.querySelectorAll('.slot').forEach(s=>s.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('step2Next').disabled = false;
}

function generateSlots(startTime, endTime, duration) {
  const slots = [];
  let [sh,sm] = startTime.split(':').map(Number);
  let [eh,em] = endTime.split(':').map(Number);
  let cur = sh*60+sm, end2 = eh*60+em;
  while (cur + duration <= end2) {
    const s = `${String(Math.floor(cur/60)).padStart(2,'0')}:${String(cur%60).padStart(2,'0')}`;
    const e = `${String(Math.floor((cur+duration)/60)).padStart(2,'0')}:${String((cur+duration)%60).padStart(2,'0')}`;
    slots.push({start:s, end:e});
    cur += duration;
  }
  return slots;
}

function renderForm(c) {
  const days=['일','월','화','수','목','금','토'];
  const d = new Date(selectedDate);
  c.innerHTML = `
  <div class="card">
    <div class="card-header"><h2>✍️ 예약자 정보 입력</h2></div>
    <div class="form-wrap">
      <div class="summary">
        <div class="sum-row"><span class="sum-label">상담자</span><span class="sum-value">${hostProfile.name}</span></div>
        <div class="sum-row"><span class="sum-label">날짜</span><span class="sum-value">${selectedDate} (${days[d.getDay()]})</span></div>
        <div class="sum-row"><span class="sum-label">시간</span><span class="sum-value">${selectedSlot.start} ~ ${selectedSlot.end}</span></div>
        <div class="sum-row"><span class="sum-label">미팅</span><span class="sum-value">${meetingType.title}</span></div>
      </div>
      <div class="fg"><label class="lbl">이름</label><input type="text" id="gName" placeholder="홍길동"></div>
      <div class="fg"><label class="lbl">전화번호</label><input type="tel" id="gPhone" placeholder="010-0000-0000"></div>
      <div class="fg"><label class="lbl">이메일 (선택)</label><input type="email" id="gEmail" placeholder="example@email.com"></div>
      <div class="fg"><label class="lbl">문의 내용 (선택)</label><textarea id="gNote" placeholder="궁금한 점을 미리 적어주세요"></textarea></div>
      <div style="font-size:11px;color:var(--muted);line-height:1.6;padding:10px;background:#f8fafc;border-radius:8px">
        ✅ 입력하신 정보는 상담 예약 목적으로만 사용됩니다
      </div>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn-secondary" onclick="renderStep(2)">← 이전</button>
    <button class="btn-primary" onclick="submitBooking()">예약 확정 →</button>
  </div>`;
}

async function submitBooking() {
  const name = document.getElementById('gName').value.trim();
  const phone = document.getElementById('gPhone').value.trim();
  const email = document.getElementById('gEmail').value.trim();
  const note = document.getElementById('gNote').value.trim();
  if (!name) { showToast('⚠️ 이름을 입력하세요'); return; }
  if (!phone) { showToast('⚠️ 전화번호를 입력하세요'); return; }

  showToast('💾 예약 중...');
  let bookingId = null;
  const {data:newBooking, error} = await sb.from('bookings').insert({
    meeting_type_id: meetingType.id,
    host_id: hostProfile.id,
    date: selectedDate,
    start_time: selectedSlot.start,
    end_time: selectedSlot.end,
    guest_name: name,
    guest_phone: phone,
    guest_email: email,
    note, status:'confirmed'
  }).select().single();

  if (error) { showToast('⚠️ 예약 실패. 다시 시도해주세요.'); return; }
  bookingId = newBooking?.id || '';
  bookedSlots.push({date:selectedDate, start_time:selectedSlot.start});

  // 상담자에게 이메일 알림 (Supabase Auth로 이메일 가져오기)
  try {
    const days=['일','월','화','수','목','금','토'];
    const d = new Date(selectedDate);
    const emailBody = `새 예약이 들어왔습니다!\n\n예약자: ${name}\n연락처: ${phone}\n날짜: ${selectedDate} (${days[d.getDay()]})\n시간: ${selectedSlot.start} ~ ${selectedSlot.end}\n미팅: ${meetingType.title}\n${note ? '문의: ' + note : ''}`;
    
    // Supabase Auth Admin API로 이메일 발송
    await sb.functions.invoke('send-booking-email', {
      body: {
        to: hostProfile.email,
        subject: `[INTO유학] 새 상담 예약 - ${name} (${selectedDate} ${selectedSlot.start})`,
        text: emailBody,
        guestName: name,
        guestPhone: phone,
        date: selectedDate,
        time: `${selectedSlot.start} ~ ${selectedSlot.end}`,
        meetingTitle: meetingType.title,
        note: note || ''
      }
    });
  } catch(e) { console.log('email notification failed', e); }

  // 성공 화면
  const days=['일','월','화','수','목','금','토'];
  const d=new Date(selectedDate);
  const c=document.getElementById('stepContent');
  [1,2,3].forEach(i=>{const el=document.getElementById('si'+i);if(el)el.className='si done';});
  c.innerHTML=`<div class="success">
    <div class="s-icon">🎉</div>
    <div class="s-title">예약이 완료되었습니다!</div>
    <div class="s-sub">${hostProfile.name} 컨설턴트가<br>예약 확인 후 연락드리겠습니다.</div>
    <div class="s-card">
      <div class="s-row"><span class="sl">예약자</span><span class="sv">${name}</span></div>
      <div class="s-row"><span class="sl">상담자</span><span class="sv">${hostProfile.name}</span></div>
      <div class="s-row"><span class="sl">날짜</span><span class="sv">${selectedDate} (${days[d.getDay()]})</span></div>
      <div class="s-row"><span class="sl">시간</span><span class="sv">${selectedSlot.start} ~ ${selectedSlot.end}</span></div>
      <div class="s-row"><span class="sl">미팅</span><span class="sv">${meetingType.title}</span></div>
    </div>
    <p style="font-size:12px;color:#64748b;margin-top:16px;margin-bottom:8px">예약을 취소하려면 아래 버튼을 누르세요</p>
    <button onclick="cancelBooking('${bookingId}')" style="font-family:'Noto Sans KR',sans-serif;font-size:13px;padding:10px 20px;border-radius:8px;background:white;color:#dc2626;border:1.5px solid #dc2626;cursor:pointer;width:100%">예약 취소</button>
  </div>`;
  window.scrollTo({top:0,behavior:'smooth'});
}

async function cancelBooking(id) {
  if (!id) { showToast('⚠️ 예약 ID를 찾을 수 없습니다'); return; }
  if (!confirm('정말 예약을 취소하시겠습니까?')) return;
  const {error} = await sb.from('bookings').update({status:'cancelled'}).eq('id', id);
  if (error) { showToast('⚠️ 취소 실패. 다시 시도해주세요.'); return; }
  bookedSlots = bookedSlots.filter(b => !(b.date===selectedDate && b.start_time===selectedSlot?.start));
  const c = document.getElementById('stepContent');
  c.innerHTML = `<div class="success">
    <div class="s-icon">✅</div>
    <div class="s-title">예약이 취소되었습니다</div>
    <div class="s-sub">언제든지 다시 예약하실 수 있습니다.</div>
    <button onclick="location.reload()" style="font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:700;padding:13px 28px;border-radius:10px;background:#0f2a47;color:white;border:none;cursor:pointer">새 예약하기</button>
  </div>`;
}

function fmtDate(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);}

init();
</script>
