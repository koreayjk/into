<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTO유학CENTER — 상담 차트</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a2e;
    --paper: #f5f0e8;
    --accent: #c8732a;
    --accent-light: #f0c99a;
    --teal: #2a7c8a;
    --teal-light: #d4eff3;
    --line: #d4c9b5;
    --muted: #8a7f72;
    --green: #2d7a4f;
    --green-light: #d4eddf;
    --red-light: #fde8e8;
    --red: #b94040;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #e8e2d6;
    min-height: 100vh;
    padding: 32px 16px;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(200,115,42,0.06) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(42,124,138,0.06) 0%, transparent 50%);
  }

  .page-header {
    max-width: 900px;
    margin: 0 auto 28px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 12px;
  }

  .logo-block h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 28px;
    color: var(--ink);
    letter-spacing: -0.5px;
  }

  .logo-block h1 span {
    color: var(--accent);
  }

  .logo-block p {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .header-actions {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .btn {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 500;
    padding: 9px 18px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
    border: none;
  }

  .btn-outline {
    background: transparent;
    border: 1.5px solid var(--ink);
    color: var(--ink);
  }

  .btn-outline:hover { background: var(--ink); color: var(--paper); }

  .btn-primary {
    background: var(--accent);
    color: white;
  }

  .btn-primary:hover { background: #a85e1f; }

  .btn-teal {
    background: var(--teal);
    color: white;
  }

  .btn-teal:hover { background: #1f6070; }

  /* Main container */
  .container {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Form card */
  .card {
    background: var(--paper);
    border-radius: 12px;
    border: 1.5px solid var(--line);
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(26,26,46,0.08);
  }

  .card-header {
    background: var(--ink);
    color: var(--paper);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .card-header h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 17px;
    font-weight: 400;
    letter-spacing: 0.3px;
  }

  .card-header .badge {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    background: rgba(245,240,232,0.15);
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: 1px;
  }

  .card-body { padding: 24px; }

  /* Form grid */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px 24px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .form-group.full { grid-column: 1 / -1; }

  label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
  }

  input, select, textarea {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    color: var(--ink);
    background: white;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    padding: 10px 14px;
    transition: border-color 0.15s, box-shadow 0.15s;
    outline: none;
    width: 100%;
  }

  input:focus, select:focus, textarea:focus {
    border-color: var(--teal);
    box-shadow: 0 0 0 3px var(--teal-light);
  }

  textarea { resize: vertical; min-height: 90px; }

  /* Decision radio group */
  .radio-group {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .radio-label {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1.5px solid var(--line);
    background: white;
    color: var(--ink);
    transition: all 0.15s;
    letter-spacing: 0;
    text-transform: none;
  }

  .radio-label input[type="radio"] { display: none; }

  .radio-label.selected-yes {
    background: var(--green-light);
    border-color: var(--green);
    color: var(--green);
  }

  .radio-label.selected-no {
    background: var(--red-light);
    border-color: var(--red);
    color: var(--red);
  }

  .radio-label.selected-pending {
    background: var(--teal-light);
    border-color: var(--teal);
    color: var(--teal);
  }

  .radio-label.selected-thinking {
    background: var(--accent-light);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Divider */
  .divider {
    border: none;
    border-top: 1px dashed var(--line);
    margin: 20px 0;
  }

  /* Records list */
  .records-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .records-header h3 {
    font-family: 'DM Serif Display', serif;
    font-size: 20px;
    color: var(--ink);
  }

  .count-badge {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    background: var(--ink);
    color: var(--paper);
    padding: 3px 12px;
    border-radius: 20px;
  }

  /* Search bar */
  .search-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }

  .search-bar input {
    flex: 1;
    padding: 10px 14px;
    font-size: 14px;
  }

  /* Record card */
  .record-item {
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 16px 20px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 16px;
    align-items: start;
    cursor: pointer;
    transition: all 0.15s;
    margin-bottom: 10px;
  }

  .record-item:hover {
    border-color: var(--teal);
    box-shadow: 0 2px 10px rgba(42,124,138,0.1);
  }

  .record-item:last-child { margin-bottom: 0; }

  .record-index {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    padding-top: 3px;
    min-width: 32px;
  }

  .record-main h4 {
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 4px;
  }

  .record-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 6px;
  }

  .meta-tag {
    font-size: 11px;
    padding: 2px 9px;
    border-radius: 20px;
    font-weight: 500;
    letter-spacing: 0.3px;
  }

  .tag-channel { background: var(--teal-light); color: var(--teal); }
  .tag-consultant { background: #ede9ff; color: #5b4bd5; }
  .tag-date { background: #fff3e0; color: #a05000; }

  .record-note {
    margin-top: 8px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .decision-badge {
    font-size: 12px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 8px;
    white-space: nowrap;
  }

  .d-yes { background: var(--green-light); color: var(--green); }
  .d-no { background: var(--red-light); color: var(--red); }
  .d-pending { background: var(--teal-light); color: var(--teal); }
  .d-thinking { background: var(--accent-light); color: var(--accent); }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(26,26,46,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
    backdrop-filter: blur(3px);
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--paper);
    border-radius: 14px;
    max-width: 600px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(26,26,46,0.3);
  }

  .modal-header {
    background: var(--ink);
    color: var(--paper);
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-radius: 12px 12px 0 0;
  }

  .modal-header h3 {
    font-family: 'DM Serif Display', serif;
    font-size: 18px;
    font-weight: 400;
  }

  .modal-close {
    background: none;
    border: none;
    color: var(--paper);
    font-size: 20px;
    cursor: pointer;
    opacity: 0.7;
    transition: opacity 0.15s;
    padding: 0 4px;
  }

  .modal-close:hover { opacity: 1; }

  .modal-body { padding: 24px; }

  .detail-row {
    display: grid;
    grid-template-columns: 120px 1fr;
    gap: 8px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }

  .detail-row:last-child { border-bottom: none; }

  .detail-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--muted);
    padding-top: 1px;
  }

  .detail-value { color: var(--ink); line-height: 1.6; }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--muted);
  }

  .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
  .empty-state p { font-size: 15px; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--ink);
    color: var(--paper);
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    transform: translateY(60px);
    opacity: 0;
    transition: all 0.3s;
    z-index: 200;
    border-left: 4px solid var(--accent);
  }

  .toast.show { transform: translateY(0); opacity: 1; }

  /* Print */
  @media print {
    body { background: white; padding: 0; }
    .page-header, .card:first-of-type, .header-actions, .search-bar, .btn { display: none; }
    .record-item { break-inside: avoid; }
  }

  @media (max-width: 600px) {
    .form-grid { grid-template-columns: 1fr; }
    .form-group.full { grid-column: 1; }
    .record-item { grid-template-columns: 1fr auto; }
    .record-index { display: none; }
    .page-header { flex-direction: column; align-items: flex-start; gap: 12px; }
  }
</style>
</head>
<body>

<div class="page-header">
  <div class="logo-block">
    <h1>INTO<span>유학</span>CENTER</h1>
    <p>Student Consultation Chart</p>
  </div>
  <div class="header-actions">
    <button class="btn btn-outline" onclick="exportData()">📥 내보내기</button>
    <button class="btn btn-teal" onclick="window.print()">🖨️ 인쇄</button>
  </div>
</div>

<div class="container">

  <!-- New Consultation Form -->
  <div class="card">
    <div class="card-header">
      <h2>신규 상담 등록</h2>
      <span class="badge">NEW ENTRY</span>
    </div>
    <div class="card-body">
      <div class="form-grid">

        <div class="form-group">
          <label>학생 이름</label>
          <input type="text" id="name" placeholder="홍길동">
        </div>

        <div class="form-group">
          <label>연락처</label>
          <input type="text" id="phone" placeholder="010-0000-0000">
        </div>

        <div class="form-group">
          <label>상담 일자</label>
          <input type="date" id="date">
        </div>

        <div class="form-group">
          <label>상담자</label>
          <select id="consultant">
            <option value="">선택</option>
            <option value="Moses 목사님">Moses 목사님</option>
            <option value="스태프 A">스태프 A</option>
            <option value="스태프 B">스태프 B</option>
            <option value="기타">기타</option>
          </select>
        </div>

        <div class="form-group full">
          <label>유입 경로</label>
          <select id="channel">
            <option value="">선택</option>
            <option value="유튜브">유튜브</option>
            <option value="인스타그램">인스타그램</option>
            <option value="카카오톡">카카오톡</option>
            <option value="네이버 검색">네이버 검색</option>
            <option value="지인 소개">지인 소개</option>
            <option value="교회 연결">교회 연결</option>
            <option value="페이스북">페이스북</option>
            <option value="기타">기타</option>
          </select>
        </div>

        <div class="form-group full">
          <label>상담 내용 요약</label>
          <textarea id="notes" placeholder="학생의 목표, 관심 학교, 전공, 비자 문의 등 주요 내용을 기록하세요..."></textarea>
        </div>

        <div class="form-group full">
          <label>결정 여부</label>
          <div class="radio-group" id="decisionGroup">
            <label class="radio-label" onclick="selectDecision(this, 'yes')">
              <input type="radio" name="decision" value="yes"> ✅ 진행 결정
            </label>
            <label class="radio-label" onclick="selectDecision(this, 'thinking')">
              <input type="radio" name="decision" value="thinking"> 🤔 검토 중
            </label>
            <label class="radio-label" onclick="selectDecision(this, 'pending')">
              <input type="radio" name="decision" value="pending"> ⏳ 재연락 예정
            </label>
            <label class="radio-label" onclick="selectDecision(this, 'no')">
              <input type="radio" name="decision" value="no"> ❌ 미진행
            </label>
          </div>
        </div>

        <div class="form-group full">
          <label>추가 메모 (팔로업 일정 등)</label>
          <input type="text" id="followup" placeholder="예: 5월 20일 재연락, 서류 준비 안내 필요...">
        </div>

      </div>

      <hr class="divider">

      <div style="display:flex; gap:12px; justify-content:flex-end;">
        <button class="btn btn-outline" onclick="clearForm()">초기화</button>
        <button class="btn btn-primary" onclick="saveRecord()">저장하기</button>
      </div>
    </div>
  </div>

  <!-- Records -->
  <div>
    <div class="records-header">
      <h3>상담 기록</h3>
      <span class="count-badge" id="countBadge">0건</span>
    </div>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="이름, 연락처, 내용으로 검색..." oninput="renderRecords()">
      <select class="btn" id="filterDecision" onchange="renderRecords()" style="padding:10px 14px; cursor:pointer; border:1.5px solid var(--line); border-radius:8px; background:var(--paper); font-size:13px;">
        <option value="">전체</option>
        <option value="yes">진행 결정</option>
        <option value="thinking">검토 중</option>
        <option value="pending">재연락</option>
        <option value="no">미진행</option>
      </select>
    </div>

    <div id="recordsList"></div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalName">상세 기록</h3>
      <button class="modal-close" onclick="closeModalDirect()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div style="padding: 0 24px 20px; display:flex; gap:10px; justify-content:flex-end;">
      <button class="btn btn-outline" onclick="deleteRecord()" style="color:var(--red); border-color:var(--red);">삭제</button>
      <button class="btn btn-teal" onclick="closeModalDirect()">닫기</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  const SHEET_URL = 'https://script.google.com/macros/s/AKfycbwx0tolAa5REyEgJyrAN8A801DfUcaNIaPYME5w7mw_iM0t-On2aJhMD95eTcDY_qNioA/exec';

  let records = JSON.parse(localStorage.getItem('intoConsultations') || '[]');
  let selectedDecision = '';
  let currentModalIndex = -1;

  // Set today's date
  document.getElementById('date').valueAsDate = new Date();

  function selectDecision(el, val) {
    selectedDecision = val;
    document.querySelectorAll('.radio-label').forEach(l => {
      l.classList.remove('selected-yes','selected-no','selected-pending','selected-thinking');
    });
    el.classList.add('selected-' + val);
  }

  async function saveRecord() {
    const name = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const date = document.getElementById('date').value;
    const consultant = document.getElementById('consultant').value;
    const channel = document.getElementById('channel').value;
    const notes = document.getElementById('notes').value.trim();
    const followup = document.getElementById('followup').value.trim();

    if (!name) { showToast('⚠️ 학생 이름을 입력해주세요.'); return; }
    if (!phone) { showToast('⚠️ 연락처를 입력해주세요.'); return; }

    const decisionLabel = { yes:'진행 결정', no:'미진행', pending:'재연락 예정', thinking:'검토 중', '':'미정' };
    const record = { id: Date.now(), name, phone, date, consultant, channel, notes, followup, decision: selectedDecision };

    // 로컬 저장
    records.unshift(record);
    localStorage.setItem('intoConsultations', JSON.stringify(records));
    renderRecords();
    clearForm();
    showToast('💾 저장 중... Google Sheets에 전송하고 있어요.');

    // Google Sheets 전송
    try {
      await fetch(SHEET_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          ...record,
          decision: decisionLabel[selectedDecision || '']
        })
      });
      showToast('✅ Google Sheets에 저장 완료!');
    } catch (err) {
      showToast('⚠️ 로컬 저장은 됐지만 Sheets 전송 실패. 인터넷 확인해주세요.');
    }
  }

  function clearForm() {
    ['name','phone','followup','notes'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('date').valueAsDate = new Date();
    document.getElementById('consultant').value = '';
    document.getElementById('channel').value = '';
    document.querySelectorAll('.radio-label').forEach(l => {
      l.classList.remove('selected-yes','selected-no','selected-pending','selected-thinking');
    });
    selectedDecision = '';
  }

  function renderRecords() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const filter = document.getElementById('filterDecision').value;
    const list = document.getElementById('recordsList');

    let filtered = records.filter(r => {
      const matchSearch = !search ||
        r.name.toLowerCase().includes(search) ||
        r.phone.includes(search) ||
        (r.notes && r.notes.toLowerCase().includes(search));
      const matchFilter = !filter || r.decision === filter;
      return matchSearch && matchFilter;
    });

    document.getElementById('countBadge').textContent = filtered.length + '건';

    if (filtered.length === 0) {
      list.innerHTML = `<div class="empty-state card"><div class="icon">📋</div><p>${records.length === 0 ? '아직 등록된 상담이 없습니다.' : '검색 결과가 없습니다.'}</p></div>`;
      return;
    }

    const decisionLabel = { yes:'✅ 진행 결정', no:'❌ 미진행', pending:'⏳ 재연락', thinking:'🤔 검토 중', '':'미정' };
    const decisionClass = { yes:'d-yes', no:'d-no', pending:'d-pending', thinking:'d-thinking', '':'d-pending' };

    list.innerHTML = filtered.map((r, i) => {
      const origIndex = records.indexOf(r);
      return `
        <div class="record-item card" onclick="openModal(${origIndex})">
          <div class="record-index">#${String(records.length - origIndex).padStart(3,'0')}</div>
          <div class="record-main">
            <h4>${r.name} <span style="font-weight:400; color:var(--muted); font-size:13px;">${r.phone}</span></h4>
            <div class="record-meta">
              ${r.date ? `<span class="meta-tag tag-date">📅 ${r.date}</span>` : ''}
              ${r.channel ? `<span class="meta-tag tag-channel">📌 ${r.channel}</span>` : ''}
              ${r.consultant ? `<span class="meta-tag tag-consultant">👤 ${r.consultant}</span>` : ''}
            </div>
            ${r.notes ? `<div class="record-note">${r.notes}</div>` : ''}
          </div>
          <div class="decision-badge ${decisionClass[r.decision || '']}">${decisionLabel[r.decision || '']}</div>
        </div>`;
    }).join('');
  }

  function openModal(index) {
    currentModalIndex = index;
    const r = records[index];
    const decisionLabel = { yes:'✅ 진행 결정', no:'❌ 미진행', pending:'⏳ 재연락 예정', thinking:'🤔 검토 중', '':'미정' };

    document.getElementById('modalName').textContent = r.name + ' 님 상담 기록';
    document.getElementById('modalBody').innerHTML = `
      <div class="detail-row"><div class="detail-label">이름</div><div class="detail-value">${r.name}</div></div>
      <div class="detail-row"><div class="detail-label">연락처</div><div class="detail-value">${r.phone}</div></div>
      <div class="detail-row"><div class="detail-label">상담 일자</div><div class="detail-value">${r.date || '미기재'}</div></div>
      <div class="detail-row"><div class="detail-label">상담자</div><div class="detail-value">${r.consultant || '미기재'}</div></div>
      <div class="detail-row"><div class="detail-label">유입 경로</div><div class="detail-value">${r.channel || '미기재'}</div></div>
      <div class="detail-row"><div class="detail-label">상담 내용</div><div class="detail-value" style="white-space:pre-wrap;">${r.notes || '없음'}</div></div>
      <div class="detail-row"><div class="detail-label">결정 여부</div><div class="detail-value">${decisionLabel[r.decision || '']}</div></div>
      <div class="detail-row"><div class="detail-label">팔로업 메모</div><div class="detail-value">${r.followup || '없음'}</div></div>
    `;
    document.getElementById('modalOverlay').classList.add('open');
  }

  function closeModal(e) {
    if (e.target === document.getElementById('modalOverlay')) closeModalDirect();
  }

  function closeModalDirect() {
    document.getElementById('modalOverlay').classList.remove('open');
    currentModalIndex = -1;
  }

  function deleteRecord() {
    if (currentModalIndex < 0) return;
    if (!confirm('이 상담 기록을 삭제하시겠습니까?')) return;
    records.splice(currentModalIndex, 1);
    localStorage.setItem('intoConsultations', JSON.stringify(records));
    closeModalDirect();
    renderRecords();
    showToast('🗑️ 기록이 삭제되었습니다.');
  }

  function exportData() {
    if (records.length === 0) { showToast('⚠️ 내보낼 기록이 없습니다.'); return; }
    const headers = ['번호','이름','연락처','상담일자','상담자','유입경로','상담내용','결정여부','팔로업'];
    const decisionLabel = { yes:'진행 결정', no:'미진행', pending:'재연락 예정', thinking:'검토 중', '':'미정' };
    const rows = records.map((r, i) => [
      records.length - i, r.name, r.phone, r.date, r.consultant, r.channel,
      '"' + (r.notes || '').replace(/"/g,'""') + '"',
      decisionLabel[r.decision || ''],
      '"' + (r.followup || '').replace(/"/g,'""') + '"'
    ].join(','));
    const csv = '\uFEFF' + headers.join(',') + '\n' + rows.join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'INTO유학CENTER_상담기록.csv';
    a.click();
    showToast('📥 CSV 파일이 다운로드되었습니다.');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }

  renderRecords();
</script>
</body>
</html>
